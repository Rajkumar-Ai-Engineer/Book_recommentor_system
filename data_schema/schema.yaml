      null_percentage: 0.0
      unique_values: 271360
    Book-Title:
      dtype: str
      non_null_count: 271360
      null_count: 0
      null_percentage: 0.0
      unique_values: 242135
    Book-Author:
      dtype: str
      non_null_count: 271358
      null_count: 2
      null_percentage: 0.0
      unique_values: 102022
    Year-Of-Publication:
      dtype: str
      non_null_count: 271360
      null_count: 0
      null_percentage: 0.0
      unique_values: 118
    Publisher:
      dtype: str
      non_null_count: 271358
      null_count: 2
      null_percentage: 0.0
      unique_values: 16807
    Image-URL-S:
      dtype: str
      non_null_count: 271360
      null_count: 0
      null_percentage: 0.0
      unique_values: 271044
    Image-URL-M:
      dtype: str
      non_null_count: 271360
