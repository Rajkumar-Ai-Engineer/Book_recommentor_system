name: Build and Deploy to ECS Fargate

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'main.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/main.yml'

permissions:
  contents: read
  id-token: write  # For OIDC authentication

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: book-recommendation-system
  ECS_SERVICE: book-recommendation-system
  ECS_CLUSTER: ml-platform-prod
  CONTAINER_NAME: book-recommendation-app

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_LATEST: latest
        run: |
          # Build and push image with multiple tags
          docker buildx build \
            --push \
            --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_LATEST \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$(git rev-parse --abbrev-ref HEAD) \
            .

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Build completed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Update ECS task definition
        id: task-def
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Download current task definition
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition' > task-definition.json

          # Update image in task definition
          sed -i "s|<IMAGE>|$ECR_REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG|g" task-definition.json

          # Register new task definition
          NEW_TASK_DEF=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.json \
            --region ${{ env.AWS_REGION }} \
            --query 'taskDefinition.revision' \
            --output text)

          echo "task-definition=${{ env.ECS_SERVICE }}:$NEW_TASK_DEF" >> $GITHUB_OUTPUT

      - name: Deploy to ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-service-stability-max-attempts: 12

      - name: Wait for service stabilization
        run: |
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}

          echo "✓ Service is stable"

      - name: Get service URL
        id: get-url
        run: |
          # Get load balancer DNS
          ALB_ARN=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].loadBalancers[0].targetGroupArn' \
            --output text)

          ALB_DNS=$(aws elbv2 describe-target-groups \
            --target-group-arns $ALB_ARN \
            --region ${{ env.AWS_REGION }} \
            --query 'TargetGroups[0].LoadBalancerArns[0]' \
            --output text | xargs -I {} aws elbv2 describe-load-balancers \
            --load-balancer-arns {} \
            --region ${{ env.AWS_REGION }} \
            --query 'LoadBalancers[0].DNSName' \
            --output text)

          echo "service-url=http://$ALB_DNS" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          echo "Checking service health at ${{ steps.get-url.outputs.service-url }}"
          for i in {1..30}; do
            if curl -f ${{ steps.get-url.outputs.service-url }}/ > /dev/null 2>&1; then
              echo "✓ Health check passed on attempt $i"
              exit 0
            fi
            echo "Health check attempt $i/30 - waiting..."
            sleep 10
          done
          echo "✗ Health check failed after 30 attempts"
          exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "✓ Deployment successful!"
          echo "Service URL: ${{ steps.get-url.outputs.service-url }}"
          echo "Image: ${{ steps.build-image.outputs.image }}"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back to previous task definition..."

          # Get previous task definition revision
          CURRENT_REVISION=$(aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }} \
            --query 'services[0].taskDefinition' \
            --output text | sed 's/.*://g')

          PREVIOUS_REVISION=$((CURRENT_REVISION - 1))

          # Update service to use previous task definition
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ env.ECS_SERVICE }}:$PREVIOUS_REVISION \
            --region ${{ env.AWS_REGION }}

          # Wait for rollback to complete
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ env.AWS_REGION }}

          echo "✓ Rolled back to task definition revision $PREVIOUS_REVISION"
          exit 1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  post-deployment-tests:
    name: Post-Deployment Tests
    runs-on: ubuntu-latest
    needs: build-and-deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get service endpoint
        id: endpoint
        run: |
          # Get ALB DNS name
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --region ${{ env.AWS_REGION }} \
            --query 'LoadBalancers[?LoadBalancerName==`book-rec-alb`].DNSName' \
            --output text)

          echo "endpoint=http://$ALB_DNS" >> $GITHUB_OUTPUT

      - name: Test health endpoint
        run: |
          curl -f ${{ steps.endpoint.outputs.endpoint }}/ || exit 1

      - name: Test suggestions endpoint
        run: |
          curl -f "${{ steps.endpoint.outputs.endpoint }}/suggestions?q=Harry" || exit 1

      - name: Test recommendation endpoint
        run: |
          curl -X POST \
            "${{ steps.endpoint.outputs.endpoint }}/recommend" \
            -F "book_name=Harry Potter" || exit 1

      - name: Verify CloudWatch logs
        run: |
          # Check that logs are being written
          LOG_COUNT=$(aws logs get-log-events \
            --log-group-name /ecs/book-recommendation-system \
            --log-stream-name ecs/book-recommendation-app/$(date +%Y-%m-%d) \
            --region ${{ env.AWS_REGION }} \
            --query 'events | length(@)' \
            --output text 2>/dev/null || echo "0")

          if [ "$LOG_COUNT" -gt 0 ]; then
            echo "✓ CloudWatch logs verified ($LOG_COUNT entries)"
          else
            echo "⚠ No recent logs found, but deployment may be successful"
          fi